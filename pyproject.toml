[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dalas-wine-quality"
version = "0.1.0"
description = "Wine ratings, price-relative value, and model explanations — DALAS course project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Ekaterina Bogush"},
    {name = "Amélie Chu"},
]
dependencies = ["numpy>=1.26,<2.3", "pandas>=2.2,<3", "Unidecode>=1.3,<2"]

[project.optional-dependencies]
analysis = [
    "jupyterlab>=4,<5",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.14",
    "scikit-learn>=1.4,<2",
    "xgboost>=2,<4",
    "catboost>=1.2,<2",
    "shap>=0.46,<0.50",
    "numba>=0.59,<0.64",
]
scraping = [
    "Scrapy>=2.13,<3",
    "scrapy-playwright>=0.0.43,<1",
    "requests>=2.31,<3",
    "aiohttp>=3.9,<4",
]
dev = ["nbformat>=5.10,<6"]

[tool.setuptools.packages.find]
where = ["src"]
