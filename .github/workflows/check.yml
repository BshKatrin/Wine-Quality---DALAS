name: Offline project checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/check_project.py
      - run: uv run python -m unittest discover -s tests -v
      - name: Validate notebook format
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import nbformat
          for path in Path('notebooks').glob('*.ipynb'):
              nbformat.validate(nbformat.read(path, as_version=4))
          PY
      - name: Discover spiders without data or network requests
        working-directory: scraping
        run: ../.venv/bin/scrapy list
